<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>3D-Vorschau</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e2430; font-family: sans-serif; }
  #bar { position: absolute; left: 8px; bottom: 8px; color: #dde; font-size: 12px;
         background: rgba(20,24,34,.7); padding: 4px 8px; border-radius: 4px; }
  #bar input { vertical-align: middle; width: 120px; }
  #bar input[type=checkbox] { width: auto; }
  .panel { position: absolute; top: 8px; color: #dde; font-size: 12px;
           background: rgba(20,24,34,.7); padding: 6px 8px; border-radius: 4px; }
  #legend { left: 8px; max-width: 230px; display: none; }
  #legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #legend .sw { width: 12px; height: 12px; border: 1px solid #111; flex: none; }
  #scale { right: 8px; width: 175px; }
  #scale .t { font-weight: bold; margin-bottom: 4px; }
  #sbar { position: relative; height: 260px; margin-left: 4px; margin-bottom: 16px; }
  #sbar .seg { position: absolute; left: 0; width: 22px; border: 1px solid #111; box-sizing: border-box; }
  #sbar .tick { position: absolute; left: 22px; width: 10px; height: 0; border-top: 2px solid #eee; }
  #sbar .lab { position: absolute; left: 36px; white-space: nowrap; transform: translateY(-50%); }
  #sbar .red { border-top-color: #f03c3c; }
  #sbar .lab.red { color: #f03c3c; font-weight: bold; }
  #swarn { margin-top: 6px; color: #f03c3c; font-weight: bold; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="legend" class="panel"></div>
<div id="scale" class="panel"><div class="t">Höhe über Wasser</div><div id="sbar"></div><div id="swarn"></div></div>
<div id="bar">Überhöhung <input id="exag" type="range" min="1" max="5" step="0.5" value="2"> <span id="exagv">2×</span>
  <label id="biomewrap" style="display:none; margin-left:10px;"><input id="biomecb" type="checkbox" checked> Biome zeigen</label>
  <label id="waterwrap" style="display:none; margin-left:10px;"><input id="watercb" type="checkbox" checked> Wasser zeigen</label></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/OrbitControls.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2430);
const camera = new THREE.PerspectiveCamera(45, 1, 10, 1e7);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(-1, 2, 1);
scene.add(sun);

let terrain = null, water = null, wall = null, floor = null;
let geoKey = "", exag = 2, baseHeights = null, minBase = 0, dim = 1, edges = [];
let zoneCol = null, biomeCol = null, showBiomes = true;
let waterMask = null, showWater = true;
const WATER_RGB = [47 / 255, 125 / 255, 230 / 255];

function setColors() {
  if (!terrain) return;
  const src = (biomeCol && showBiomes) ? biomeCol : zoneCol;
  const attr = terrain.geometry.attributes.color;
  for (let i = 0; i < src.length; i++) attr.array[i] = src[i];
  if (waterMask && showWater) {
    for (let v = 0; v < waterMask.length; v++) {
      if (waterMask[v]) {
        attr.array[v * 3] = WATER_RGB[0];
        attr.array[v * 3 + 1] = WATER_RGB[1];
        attr.array[v * 3 + 2] = WATER_RGB[2];
      }
    }
  }
  attr.needsUpdate = true;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function fmt(v) { return (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10) + " m"; }

function buildLegend(p) {
  const box = document.getElementById("legend");
  box.textContent = "";
  const list = p.biomes || [];
  if (!list.length) { box.style.display = "none"; return; }
  box.style.display = "block";
  box.appendChild(el("div", "", "Gewählte Biome")).style.fontWeight = "bold";
  for (const b of list) {
    const row = el("div", "row");
    const sw = el("span", "sw");
    sw.style.background = "rgb(" + b.rgb.join(",") + ")";
    row.appendChild(sw);
    row.appendChild(el("span", "", b.name + " (" + Math.round(b.pct) + " %)"));
    box.appendChild(row);
  }
}

// Hoehenskala: Meter ueber Wasser. Fels/Schnee-Striche werden rot, sobald das
// Gelaende sie erreicht; rote Enden, wenn es aus dem Editor-Fenster faellt.
function buildScale(p) {
  const bar = document.getElementById("sbar");
  bar.textContent = "";
  const H = 260, PAD = 30;                       // Hauptbereich und Verlaengerungen oben/unten
  const water = p.water_level_m;
  const loLim = p.editor_min_m - water;          // Editor-Grenzen in Metern ueber Wasser
  const hiLim = p.editor_max_m - water;
  const lo = Math.min(p.min_above_m, 0);
  const hi = Math.max(p.max_above_m, p.snow_above_m * 1.05, 1);
  const extTop = hiLim > hi, extBottom = loLim < lo;   // Grenze weit weg: gestreiftes Stueck
  const top0 = extTop ? PAD : 0;
  const total = top0 + H + (extBottom ? PAD : 0);
  bar.style.height = total + "px";
  const y = (v) => top0 + H - (v - lo) / (hi - lo) * H;
  const seg = (a, b, color) => {
    if (b <= a) return;
    const s = el("div", "seg");
    s.style.top = y(b) + "px"; s.style.height = Math.max(1, y(a) - y(b)) + "px";
    s.style.background = color;
    bar.appendChild(s);
  };
  // Abschnitte kommen fertig aus Python (Wasser, Biome nach Hoehe, Fels, Schnee)
  for (const s of (p.scale_segments || [])) seg(s.a, s.b, "rgb(" + s.rgb.join(",") + ")");

  // Verlaengerungen bis zu den Editor-Grenzen (gestreift = Bereich unterbrochen)
  const stripes = (c) => "repeating-linear-gradient(45deg," + c + " 0 4px,transparent 4px 8px)";
  if (extTop) {
    const d = el("div", "seg"); d.style.top = "0px"; d.style.height = PAD + "px";
    d.style.background = stripes("#8899bb"); bar.appendChild(d);
  }
  if (extBottom) {
    const d = el("div", "seg"); d.style.top = (top0 + H) + "px"; d.style.height = PAD + "px";
    d.style.background = stripes("#3d6ad0"); bar.appendChild(d);
  }
  // Gelaende ueber/unter der Editor-Grenze: rot hinterlegt
  const overlay = (a, b) => {
    const d = el("div", "seg"); d.style.top = y(b) + "px"; d.style.height = Math.max(1, y(a) - y(b)) + "px";
    d.style.background = "rgba(240,60,60,.65)"; bar.appendChild(d);
  };
  if (!extTop && hiLim < hi) overlay(hiLim, hi);
  if (!extBottom && loLim > lo) overlay(lo, loLim);

  const labels = [];
  const tick = (yy, text, red) => {
    const t = el("div", "tick" + (red ? " red" : ""));
    t.style.top = yy + "px";
    bar.appendChild(t);
    const l = el("div", "lab" + (red ? " red" : ""), text);
    bar.appendChild(l);
    labels.push({ y: yy, el: l });
  };
  tick(y(0), "0 m Wasser", false);
  tick(y(p.rock_above_m), fmt(p.rock_above_m) + " Fels", p.max_above_m >= p.rock_above_m);
  tick(y(p.snow_above_m), fmt(p.snow_above_m) + " Schnee", p.max_above_m >= p.snow_above_m);
  tick(y(p.max_above_m), fmt(p.max_above_m) + " Gelände", false);
  if (p.min_above_m < 0) tick(y(p.min_above_m), fmt(p.min_above_m), false);
  // Editor-Grenzen (absolute Hoehe) immer in rot
  tick(extTop ? 0 : y(hiLim), fmt(p.editor_max_m) + " Editor-Grenze", true);
  tick(extBottom ? total : y(loLim), fmt(p.editor_min_m) + " Editor-Grenze", true);

  // Beschriftungen von oben nach unten, mindestens 14 px Abstand (die Striche
  // bleiben an der echten Hoehe).
  labels.sort((a, b) => a.y - b.y);
  let last = -Infinity;
  for (const item of labels) {
    const pos = Math.max(item.y, last + 14);
    item.el.style.top = pos + "px";
    last = pos;
  }

  const warn = [];
  if (p.abs_max_m > p.editor_max_m) warn.push("über " + fmt(p.editor_max_m) + " (Editor)");
  if (p.abs_min_m < p.editor_min_m) warn.push("unter " + fmt(p.editor_min_m) + " (Editor)");
  document.getElementById("swarn").textContent = warn.length ? "Außerhalb: " + warn.join(", ") : "";
}

function b64(s, Type) {
  const bin = atob(s), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Type(buf.buffer);
}

function removeAll() {
  for (const m of [terrain, water, wall, floor]) {
    if (m) { scene.remove(m); m.geometry.dispose(); }
  }
  terrain = water = wall = floor = null;
}

function updateWalls() {
  const tp = terrain.geometry.attributes.position;
  const wp = wall.geometry.attributes.position;
  const floorY = Math.min(0, minBase * exag) - 0.1 * dim;
  let o = 0;
  for (const edge of edges) {
    const n = edge.length;
    for (let k = 0; k < n; k++) {
      const vi = edge[k], x = tp.getX(vi), z = tp.getZ(vi);
      wp.setXYZ(o + k, x, tp.getY(vi), z);
      wp.setXYZ(o + n + k, x, floorY, z);
    }
    o += 2 * n;
  }
  wp.needsUpdate = true;
  wall.geometry.computeVertexNormals();
  wall.geometry.computeBoundingSphere();
  floor.position.y = floorY;
  const top = -0.002 * dim;
  const depth = top - floorY;
  water.scale.y = depth;
  water.position.y = floorY + depth / 2;
}

function applyHeights() {
  if (!terrain || !baseHeights) return;
  const pos = terrain.geometry.attributes.position;
  for (let i = 0; i < baseHeights.length; i++) pos.setY(i, baseHeights[i] * exag);
  pos.needsUpdate = true;
  terrain.geometry.computeVertexNormals();
  terrain.geometry.computeBoundingSphere();
  updateWalls();
}

window.setMesh = function (p) {
  const rows = p.rows, cols = p.cols, cell = p.cell_m;
  baseHeights = b64(p.heights_b64, Float32Array);
  minBase = Infinity;
  for (let i = 0; i < baseHeights.length; i++) if (baseHeights[i] < minBase) minBase = baseHeights[i];
  const col8 = b64(p.colors_b64, Uint8Array);
  const bio8 = p.biome_colors_b64 ? b64(p.biome_colors_b64, Uint8Array) : null;
  waterMask = p.water_b64 ? b64(p.water_b64, Uint8Array) : null;
  const key = rows + "x" + cols + "@" + cell;
  const first = !terrain;
  removeAll();

  const pos = new Float32Array(rows * cols * 3);
  const col = new Float32Array(rows * cols * 3);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    pos[i*3] = (c - (cols - 1) / 2) * cell;
    pos[i*3+2] = (r - (rows - 1) / 2) * cell;
    col[i*3] = col8[i*3] / 255; col[i*3+1] = col8[i*3+1] / 255; col[i*3+2] = col8[i*3+2] / 255;
  }
  const idx = new Uint32Array((rows - 1) * (cols - 1) * 6);
  let k = 0;
  for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
    const a = r * cols + c, b = a + 1, d = a + cols, e = d + 1;
    idx[k++] = a; idx[k++] = d; idx[k++] = b; idx[k++] = b; idx[k++] = d; idx[k++] = e;
  }
  zoneCol = new Float32Array(col);
  biomeCol = null;
  if (bio8) {
    biomeCol = new Float32Array(rows * cols * 3);
    for (let i = 0; i < biomeCol.length; i++) biomeCol[i] = bio8[i] / 255;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  terrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  scene.add(terrain);

  const w = (cols - 1) * cell, h = (rows - 1) * cell;
  dim = Math.max(w, h);

  // Randwaende: oben Gelaenderand, unten Bodenplatte
  edges = [[], [], [], []];
  for (let c = 0; c < cols; c++) { edges[0].push(c); edges[1].push((rows - 1) * cols + c); }
  for (let r = 0; r < rows; r++) { edges[2].push(r * cols); edges[3].push(r * cols + cols - 1); }
  let total = 0;
  for (const e of edges) total += e.length;
  const widx = [];
  let o = 0;
  for (const e of edges) {
    const n = e.length;
    for (let j = 0; j < n - 1; j++) {
      const a = o + j, b = o + j + 1, c2 = o + n + j, d2 = o + n + j + 1;
      widx.push(a, c2, b, b, c2, d2);
    }
    o += 2 * n;
  }
  const wgeo = new THREE.BufferGeometry();
  wgeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(total * 2 * 3), 3));
  wgeo.setIndex(widx);
  const earth = new THREE.MeshLambertMaterial({ color: 0x6b4a36, side: THREE.DoubleSide });
  wall = new THREE.Mesh(wgeo, earth);
  scene.add(wall);

  floor = new THREE.Mesh(new THREE.PlaneGeometry(w, h), earth);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Wasser als Block (Aquarium): vom Boden bis zum Wasserspiegel
  water = new THREE.Mesh(
    new THREE.BoxGeometry(w * 0.996, 1, h * 0.996),
    new THREE.MeshLambertMaterial({ color: 0x2f5fd0, transparent: true, opacity: 0.55, depthWrite: false })
  );
  water.renderOrder = 1;
  scene.add(water);

  document.getElementById("biomewrap").style.display = biomeCol ? "inline" : "none";
  document.getElementById("waterwrap").style.display = waterMask ? "inline" : "none";
  setColors();
  buildLegend(p);
  buildScale(p);
  applyHeights();
  if (first || key !== geoKey) {
    camera.position.set(0, dim * 0.7, dim * 0.9);
    camera.near = dim / 1000; camera.far = dim * 20; camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.update();
  }
  geoKey = key;
};

document.getElementById("biomecb").addEventListener("change", (e) => {
  showBiomes = e.target.checked;
  setColors();
});

document.getElementById("watercb").addEventListener("change", (e) => {
  showWater = e.target.checked;
  setColors();
});

document.getElementById("exag").addEventListener("input", (e) => {
  exag = parseFloat(e.target.value);
  document.getElementById("exagv").textContent = exag + "×";
  applyHeights();
});

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
